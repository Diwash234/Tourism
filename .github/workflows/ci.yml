name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Django checks + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r Tourism/requirement.txt
          pip install -r ml_service/requirements.txt
      - name: Django system check
        working-directory: Tourism
        run: python manage.py check
      - name: Run backend tests
        working-directory: Tourism
        run: python manage.py test --parallel 1

  frontend:
    name: Frontend build + e2e layout tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend/Tourism
        run: npm ci || npm install --no-audit --no-fund
      - name: Unit-verify chart components
        working-directory: frontend/Tourism
        run: npm run verify:charts
      - name: Build frontend
        working-directory: frontend/Tourism
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend/Tourism
        run: npx playwright install chromium
      - name: Run e2e layout/overlap tests
        working-directory: frontend/Tourism
        run: npx playwright test e2e/layout.spec.js
        env:
          CI: true
