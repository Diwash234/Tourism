name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Tourism/requirements.txt
          pip install bandit semgrep

      - name: Run Django checks
        working-directory: Tourism
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SECRET_KEY: ci-only-long-random-secret-key-2026-10-03-tourism-release-gate-7f2a9c
          DEBUG: "False"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        working-directory: Tourism
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SECRET_KEY: ci-only-long-random-secret-key-2026-10-03-tourism-release-gate-7f2a9c
          DEBUG: "False"
        run: |
          python manage.py migrate

      - name: Run tests
        working-directory: Tourism
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SECRET_KEY: ci-only-long-random-secret-key-2026-10-03-tourism-release-gate-7f2a9c
          DEBUG: "False"
        run: |
          python manage.py test --noinput

      - name: Run Bandit security scan
        working-directory: Tourism
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll

      - name: Run Semgrep security scan
        working-directory: Tourism
        run: |
          semgrep --config=auto --error --json -o semgrep-report.json . || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            Tourism/bandit-report.json
            Tourism/semgrep-report.json

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend/Tourism
        run: npm ci

      - name: Run build
        working-directory: frontend/Tourism
        run: npm run build

      - name: Run lint
        working-directory: frontend/Tourism
        run: npm run lint || true

      - name: Run npm audit
        working-directory: frontend/Tourism
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tourism-platform:test .

      - name: Test Docker image
        run: |
          docker run --rm tourism-platform:test python -c "import django; print(django.get_version())"

  production-config-validation:
    name: Production Config Validation
    runs-on: ubuntu-latest
    needs: [backend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Tourism/requirements.txt

      - name: Validate production config
        working-directory: Tourism
        env:
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: ci-only-long-random-secret-key-2026-10-03-tourism-release-gate-7f2a9c
          DEBUG: "False"
        run: |
          python manage.py validate_production_config || true
