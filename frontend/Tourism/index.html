<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Nepal Yatra | Explore the Himalayas — Destinations, Trip Planning & Safety</title>
    <meta name="title" content="Nepal Yatra | Explore, plan and travel across Nepal" />
    <meta name="description" content="Discover destinations, compare places, build an itinerary and find practical travel and safety information for Nepal." />
    <meta name="keywords" content="Nepal tourism, Nepal destinations, Nepal itinerary, Nepal travel planning, Himalayan travel" />
    <meta name="author" content="Nepal Yatra" />
    <meta name="theme-color" content="#075B48" />

    <!-- Canonical/og:url/JSON-LD: injected at build time from VITE_SITE_URL
         (vite.config.js siteMetadata plugin) and set per page at runtime by
         useSeo() from the real origin. Never hardcode a domain here. -->

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nepal Yatra | Explore, plan and travel across Nepal" />
    <meta property="og:description" content="Discover destinations, compare places, build an itinerary and find practical travel and safety information for Nepal." />
    <meta property="og:site_name" content="Nepal Yatra" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nepal Yatra | Explore, plan and travel across Nepal" />
    <meta name="twitter:description" content="Discover destinations, compare places, build an itinerary and find practical travel and safety information for Nepal." />

    <!-- Fonts are self-hosted (@fontsource, imported in src/main.jsx): no request
      to Google, and nothing blocks the first paint. -->

  </head>
  <body class="bg-[var(--ny-bg)] text-gray-900 antialiased selection:bg-[var(--ny-green)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
