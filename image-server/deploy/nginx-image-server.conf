# Nginx vhost for the Tourism image server (production).
#
# Drop this file into /etc/nginx/sites-available/ (or conf.d/), symlink it
# into sites-enabled/, then `nginx -t && systemctl reload nginx`.
#
# What this does:
#   - Serves the image dataset DIRECTLY from disk (Django is never involved).
#   - Adds long-lived caching headers so the browser caches images forever.
#   - Optionally supports a thumbnailing proxy (e.g. via ImageMagick) — see
#     the commented location below.
#
# Replace placeholders:
#   images.example.com   -> your image hostname (must match IMAGE_BASE_URL)
#   /srv/tourism-images  -> where image-server/images/ is deployed on disk

server {
    listen 80;
    server_name images.example.com;
    # Optional: redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name images.example.com;

    # --- TLS certificates (adjust to your setup) ---
    ssl_certificate     /etc/letsencrypt/live/images.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/images.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Document root = the images/ tree (NOT the Django project) ---
    root /srv/tourism-images;
    autoindex off;
    index index.html;

    # --- Image files: serve straight from disk, cache hard ---
    location /images/ {
        try_files $uri =404;

        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";   # only if cross-origin <img> use is needed

        # Optional: on-the-fly thumbnail generation (requires ImageMagick / ngx_http_image_filter_module)
        # image_filter resize 480 -;
        # image_filter_jpeg_quality 80;
        # image_filter_buffer 10M;
        # location ~ ^/images/(.+)\.(jpg|jpeg|png|webp)$ { ... }
    }

    # --- Small JSON manifest describing the dataset (optional) ---
    location = /images/manifest.json {
        try_files /manifest.json =404;
    }

    # --- Logging ---
    access_log /var/log/nginx/images.example.com.access.log;
    error_log  /var/log/nginx/images.example.com.error.log warn;
}

# Example production URL after this config is live:
#   https://images.example.com/images/nepal/kathmandu/001.webp
