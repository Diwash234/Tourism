services:
  - type: web
    name: tourism-recommendation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      # Render injects the existing tourism_db private connection string.
      # The real URL/password stays in Render, not Git.
      - key: DATABASE_URL
        fromDatabase:
          name: tourism_db
          property: connectionString
      # NO DATABASE_SSLMODE here: fromDatabase injects the *internal* URL,
      # which is plain TCP on Render's private network and does not do SSL.
      # Setting sslmode=require against it fails the handshake at boot.
      # Only set DATABASE_SSLMODE=require when pointing at the *external* URL.
      # Primary admin credentials are entered in Render Environment Variables;
      # never commit the password to the repository.
      - key: TOURISM_ADMIN_EMAIL
        sync: false
      - key: TOURISM_ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
      - key: ML_SERVICE_URL
        value: "http://localhost:8001"
      # Run the ML sidecar after database setup. ML models and optional
      # accelerators now load only when their corresponding API is requested.
      - key: START_ML_SERVICE
        value: "1"
      - key: ASGI_THREADS
        value: "2"
      - key: ML_SERVICE_MAX_CONCURRENCY
        value: "4"
      - key: ACCESS_TOKEN_LIFETIME_MIN
        value: "60"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: NOTIFICATION_WORKER_ENABLED
        value: "false"
      - key: NOTIFICATION_WORKER_INTERVAL
        value: "60"
      # Pre-builds the OpenAPI document at start-up. Useful in development
      # (saves the ~28s first request after each code save) but it is a
      # transient allocation, and a 512 MiB instance cannot afford it.
      - key: OPENAPI_SCHEMA_WARMUP_ENABLED
        value: "0"
      - key: LOCAL_GRAPH_ROUTING_ENABLED
        value: "true"
      - key: LOCAL_GRAPH_MAX_SNAP_KM
        value: "100"
      - key: PHOTO_PROMOTION_IMPRESSION_THRESHOLD
        value: "50"
      - key: FX_AUTO_REFRESH
        value: "true"
      - key: TOURISM_DATA_MODE
        value: "database"
      - key: RUN_DATA_REPAIRS_ON_BOOT
        value: "0"

databases:
  - name: tourism_db
    plan: free
    databaseName: tourism_db
    user: tourism_user
