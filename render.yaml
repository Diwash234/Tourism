services:
  - type: web
    name: tourism-recommendation
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      # Render injects the existing tourism_db private connection string.
      # The real URL/password stays in Render, not Git.
      - key: DATABASE_URL
        fromDatabase:
          name: tourism_db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
