services:
  - type: web
    name: tourism-recommendation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      # Render injects the existing tourism_db private connection string.
      # The real URL/password stays in Render, not Git.
      - key: DATABASE_URL
        fromDatabase:
          name: tourism_db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: "require"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
      - key: ML_SERVICE_URL
        value: "http://localhost:8001"
      - key: ACCESS_TOKEN_LIFETIME_MIN
        value: "60"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: NOTIFICATION_WORKER_ENABLED
        value: "true"
      - key: NOTIFICATION_WORKER_INTERVAL
        value: "60"
      - key: LOCAL_GRAPH_ROUTING_ENABLED
        value: "true"
      - key: LOCAL_GRAPH_MAX_SNAP_KM
        value: "100"
      - key: PHOTO_PROMOTION_IMPRESSION_THRESHOLD
        value: "50"
      - key: FX_AUTO_REFRESH
        value: "true"

databases:
  - name: tourism_db
    plan: free
    databaseName: tourism_db
    user: tourism_user
