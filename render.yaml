services:
  - type: web
    name: tourism-recommendation
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: "sqlite"
      - key: DB_NAME
        value: "/var/lib/tourism/data/db.sqlite3"
      - key: MEDIA_ROOT
        value: "/var/lib/tourism/media"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
    disk:
      name: tourism-data
      mountPath: /var/lib/tourism
      sizeGB: 10
