databases:
  - name: tourism_db
    databaseName: tourism_db
    user: tourism_user
    plan: free

services:
  - type: web
    name: tourism-recommendation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      # Render injects the tourism_db private connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: tourism_db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "false"
      - key: MEDIA_ROOT
        value: "/app/Tourism/media"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
