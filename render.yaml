services:
  - type: web
    name: tourism-recommendation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      # Render injects the existing tourism_db private connection string.
      # The real URL/password stays in Render, not Git.
      - key: DATABASE_URL
        fromDatabase:
          name: tourism_db
          property: connectionString
      # NO DATABASE_SSLMODE here: fromDatabase injects the *internal* URL,
      # which is plain TCP on Render's private network and does not do SSL.
      # Setting sslmode=require against it fails the handshake at boot.
      # Only set DATABASE_SSLMODE=require when pointing at the *external* URL.
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
      - key: ML_SERVICE_URL
        value: "http://localhost:8001"
      # Run the ML sidecar (budget/itinerary/safety/recommendation) in the
      # web container. The entrypoint starts it only AFTER migrations and
      # the data phase, so its import spike cannot overlap other Python
      # processes. Set to "0" if a 512 MiB instance ever OOMs -- Django
      # falls back to deterministic CSV/database answers without it.
      - key: START_ML_SERVICE
        value: "0"
      - key: ACCESS_TOKEN_LIFETIME_MIN
        value: "60"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: NOTIFICATION_WORKER_ENABLED
        value: "false"
      - key: NOTIFICATION_WORKER_INTERVAL
        value: "60"
      # tourist/apps.py pre-builds ~6,700 destination fact rows in a daemon
      # thread at start-up (measured: 14.6s). On a 512 MiB instance that
      # overlapped daphne and pushed the deploy over the limit again. Off here;
      # the fact table is still built on first use, just not pre-warmed.
      - key: TRAVELLER_FACTS_WARMUP_ENABLED
        value: "0"
      - key: LOCAL_GRAPH_ROUTING_ENABLED
        value: "true"
      - key: LOCAL_GRAPH_MAX_SNAP_KM
        value: "100"
      - key: PHOTO_PROMOTION_IMPRESSION_THRESHOLD
        value: "50"
      - key: FX_AUTO_REFRESH
        value: "true"
      - key: TOURISM_DATA_MODE
        value: "database"
      - key: RUN_DATA_REPAIRS_ON_BOOT
        value: "0"

databases:
  - name: tourism_db
    plan: free
    databaseName: tourism_db
    user: tourism_user
